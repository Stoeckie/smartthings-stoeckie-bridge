name: stoeckie-aircon-mh
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: airConditionerMode
        version: 1
      - id: thermostatCoolingSetpoint
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: airConditionerFanMode
        version: 1
      - id: fanOscillationMode
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: AirConditioner
  - id: outdoor
    capabilities:
      - id: temperatureMeasurement
        version: 1
  - id: minHeat
    label: Minimum Heat
    capabilities:
      - id: switch
        version: 1
preferences:
  - name: pollSeconds
    title: Update every (seconds)
    description: "How often the bridge reads the air conditioners from the FGLair cloud. Applies to all of them. 30 to 600, also on the bridge setup page."
    required: false
    preferenceType: integer
    definition:
      minimum: 30
      maximum: 600
      default: 60
