name: stoeckie-rainradar-v3
components:
  - id: main
    capabilities:
      - id: rainSensor
        version: 1
      - id: precipitationSensor
        version: 1
      - id: silvervalley08660.rainForecast
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: RainSensor
  - id: dewNow
    label: Dew point now
    capabilities:
      - id: temperatureMeasurement
        version: 1
  - id: dewMax
    label: Dew point max (forecast)
    capabilities:
      - id: temperatureMeasurement
        version: 1
  - id: wind
    label: Wind
    capabilities:
      - id: silvervalley08660.windSpeedKmh
        version: 1
preferences:
  - name: rainMode
    title: Show
    description: "Detail: rain now (mm/h), minutes until rain, how long it rains and a summary, usable in routines. Simple: only rain or dry."
    required: false
    preferenceType: enumeration
    definition:
      options:
        detail: "Detail"
        simple: "Rain or dry only"
      default: "detail"
  - name: postcode
    title: Postcode (NL)
    description: Dutch postcode, e.g. 1234AB. Together with the house number this sets the location. Elsewhere use the address.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: houseNumber
    title: House number
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: address
    title: Or address (any country)
    description: "Street and number, city, country, e.g. Rue de Rivoli 1, Paris, France. Looked up once (OpenStreetMap)."
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: location
    title: Or latitude, longitude
    description: "e.g. 48.86, 2.35. Wins over the postcode and the address. Leave empty to use those."
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: radiusMeters
    title: Radius (meters)
    description: Rain anywhere within this distance counts. 0 = only the address. Max 25000.
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 25000
      default: 0
  - name: rainThreshold
    title: Rain from (mm/h)
    description: Less than this counts as dry. Default 0.1.
    required: false
    preferenceType: number
    definition:
      minimum: 0.05
      maximum: 5
      default: 0.1
  - name: provider
    title: Source
    description: "Auto: Buienradar in the Netherlands and Belgium (radar, 5 minute steps), Open-Meteo elsewhere (15 minute steps)."
    required: false
    preferenceType: enumeration
    definition:
      options:
        auto: "Auto"
        buienradar: "Buienradar (NL/BE)"
        openmeteo: "Open-Meteo (worldwide)"
      default: "auto"
  - name: humidHours
    title: Dew point forecast (hours)
    description: "Dew point max: the highest outdoor dew point in the next hours (Open-Meteo, hourly). For routines that look ahead, e.g. keep a crawl space dryer on when humid air is coming. 6 to 72, default 48."
    required: false
    preferenceType: integer
    definition:
      minimum: 6
      maximum: 72
      default: 48
