name: stoeckie-aircon-v3
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: airConditionerMode
        version: 1
      - id: thermostatCoolingSetpoint
        version: 1
      - id: silvervalley08660.airconMode
        version: 1
      - id: silvervalley08660.targetTemperature
        version: 1
      - id: silvervalley08660.airflowDirection
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: airConditionerFanMode
        version: 1
      - id: fanOscillationMode
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: AirConditioner
  - id: outdoor
    capabilities:
      - id: temperatureMeasurement
        version: 1
preferences:
  - name: temperatureUnit
    title: Temperature unit
    description: "Unit of the Set temperature slider. Auto or °C: the °C slider. °F: a °F slider, use this in a location set to °F (the app shows the °C slider in °C)."
    required: false
    preferenceType: enumeration
    definition:
      options:
        auto: Auto
        C: "°C"
        F: "°F"
      default: auto
  - name: vAirflowOrder
    title: Vertical airflow order
    description: "Position 1 in the app is the top. Fujitsu units count from the bottom; if yours counts from the top (position 1 in the app points down), choose Unit counts from the top."
    required: false
    preferenceType: enumeration
    definition:
      options:
        bottom: Unit counts from the bottom
        top: Unit counts from the top
      default: bottom
  - name: offChanges
    title: Changes while off
    description: "Fujitsu units switch on with any change. Keep: a change made while the unit is off is shown and sent when you switch it on. Send now: sent right away (the unit switches on)."
    required: false
    preferenceType: enumeration
    definition:
      options:
        keep: Keep until switched on
        send: Send now (switches on)
      default: keep
  - name: pollSeconds
    title: Update every (seconds)
    description: "How often the bridge reads the air conditioners from the FGLair cloud. Applies to all of them. 30 to 600, also on the bridge setup page."
    required: false
    preferenceType: integer
    definition:
      minimum: 30
      maximum: 600
      default: 60
