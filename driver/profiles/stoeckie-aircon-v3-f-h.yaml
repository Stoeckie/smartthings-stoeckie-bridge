name: stoeckie-aircon-v3-f-h
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: airConditionerMode
        version: 1
      - id: thermostatCoolingSetpoint
        version: 1
      - id: silvervalley08660.airconMode
        version: 1
      - id: silvervalley08660.targetTemperatureF
        version: 1
      - id: silvervalley08660.airflowDirection
        version: 1
      - id: silvervalley08660.horizontalAirflow
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: airConditionerFanMode
        version: 1
      - id: fanOscillationMode
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: AirConditioner
  - id: outdoor
    capabilities:
      - id: temperatureMeasurement
        version: 1
preferences:
  - name: temperatureUnit
    title: Temperature unit
    description: "Unit of the Set temperature slider. Auto: °C, and °F once SmartThings sends a °F value (US locations)."
    required: false
    preferenceType: enumeration
    definition:
      options:
        auto: Auto
        C: "°C"
        F: "°F"
      default: auto
  - name: pollSeconds
    title: Update every (seconds)
    description: "How often the bridge reads the air conditioners from the FGLair cloud. Applies to all of them. 30 to 600, also on the bridge setup page."
    required: false
    preferenceType: integer
    definition:
      minimum: 30
      maximum: 600
      default: 60
metadata:
  vid: VID_V3_F_H
  mnmn: SmartThingsCommunity
