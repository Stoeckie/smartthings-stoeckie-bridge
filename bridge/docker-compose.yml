# Stoeckie Bridge (AEG / Electrolux, Fujitsu FGLair, Škoda, VELUX, Buienradar, iRobot favorites) in Docker.
# Host networking: the hub reaches the bridge on the host IP, port 8787, and the setup page works on
# http://localhost:8787/setup in a browser on the Docker host (https on port 8443, self-signed).
# Without host networking (Docker Desktop, many NAS): comment out network_mode and use the ports line; the
# setup page then works from a browser on the Docker host after you enter the setup key (docker logs
# stoeckie-bridge, or data/setup-key.txt): on Docker Desktop the whole LAN arrives from the Docker gateway.
#
# Your own settings: put them in docker-compose.override.yml next to this file (copy
# docker-compose.override.example.yml). Docker Compose reads that file automatically and git never touches it, so
# a git pull no longer conflicts with your changes. Leave this file as it is.
services:
  stoeckie-bridge:
    build: .
    container_name: stoeckie-bridge
    restart: unless-stopped
    # the bridge needs about 60 to 120 MB; the limit restarts the container instead of starving the host
    mem_limit: 400m
    network_mode: host
    # ports: ["8787:8787", "8443:8443"]   # instead of network_mode: host
    volumes:
      - ./data:/data
    environment:
      TZ: Europe/Amsterdam
      # Allow the setup page from another computer on your LAN (https://<host ip>:8443/setup), e.g.:
      # STBRIDGE_SETUP_ALLOW: "192.168.1.20/32"
      # Optional instead of the setup page, only read on the first start:
      # ELECTROLUX_API_KEY: ""
      # ELECTROLUX_ACCESS_TOKEN: ""
      # ELECTROLUX_REFRESH_TOKEN: ""
      # FGLAIR_USERNAME: ""
      # FGLAIR_PASSWORD: ""
      # FGLAIR_REGION: "eu"
